services:
  app:
    build: .
    container_name: rosetta-app
    ports:
      # Bind solo a localhost: nginx hace de reverse proxy con HTTPS.
      # Evita exponer la app sin TLS y saltarse el firewall de Docker.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      ROSETTA_API_HOST: "0.0.0.0"
      ROSETTA_API_PORT: "8000"
      ROSETTA_API_RELOAD: "false"
      CHROMADB_PATH: "/app/.chroma"
      ROSETTA_SESSION_DB: "/app/data/.rosetta_sessions.db"
    volumes:
      - rosetta_chroma:/app/.chroma
      - rosetta_data:/app/data
      - ./corpus:/app/corpus:ro
      - ./reports:/app/reports
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  neo4j:
    image: neo4j:5.18-community
    container_name: rosetta-neo4j
    ports:
      # Solo localhost — acceso al browser Neo4j vía túnel SSH si se necesita.
      - "127.0.0.1:7474:7474"   # HTTP browser
      - "127.0.0.1:7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-rosetta_dev}"
      NEO4J_PLUGINS: "[]"
      NEO4J_server_memory_heap_initial__size: "256m"
      NEO4J_server_memory_heap_max__size: "512m"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:-rosetta_dev}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  rosetta_chroma:
  rosetta_data:
