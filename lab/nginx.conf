# Laboratorio de ROSETTA: configuración DELIBERADAMENTE insegura (ver lab/README.md).
# Solo accesible desde la red interna de Docker Compose (sin puertos publicados).
server {
    listen 80;
    server_name lab-objetivo;
    root /usr/share/nginx/html;

    # Fallo intencionado: revela la versión de nginx en cabeceras y páginas de error.
    server_tokens on;

    location / {
        index index.html;
    }

    # Fallo intencionado: listado de directorio con copias de seguridad.
    location /backups/ {
        autoindex on;
    }

    # Fallo intencionado: fichero de configuración servido como texto.
    location = /.env {
        default_type text/plain;
    }
}
