[project]
name = "rosetta"
version = "0.1.0"
description = "Orquestador de cumplimiento continuo. Traduce hallazgos técnicos a evidencia normativa multi-marco (ISO 27001, ENS, NIS2, DORA) usando IA."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Mj", email = "michael.jt.pro@gmail.com" }
]
keywords = [
    "compliance",
    "grc",
    "cybersecurity",
    "iso27001",
    "ens",
    "nis2",
    "dora",
    "ai",
    "rag",
    "osint"
]

dependencies = [
    # LLM
    "anthropic>=0.39.0",
    # Validación y modelos
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # CLI
    "typer>=0.12.0",
    "rich>=13.9.0",
    # RAG
    "chromadb>=0.5.0",
    "sentence-transformers>=3.2.0",
    # Grafo
    "neo4j>=5.25.0",
    # Utilidades
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    # Parseo normativo
    "pypdf>=5.0.0",
    "markdown-it-py>=3.0.0",
    "pyyaml>=6.0.0",
    # Orquestación open source sensors
    "python-nmap>=0.7.1",
    "weasyprint>=68.1",
    "pdfplumber>=0.11.9",
    "pdf2image>=1.17.0",
    "reportlab>=4.4.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
rosetta = "rosetta.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rosetta"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # unused arguments
    "SIM", # simplify
]
ignore = ["E501"]  # line-length handled by formatter

[tool.ruff.lint.per-file-ignores]
# load_dotenv() se llama antes de imports para cargar vars de entorno pronto
"src/rosetta/api/main.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = true

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "neo4j.*",
    "nmap.*",
    "sentence_transformers.*",
    "reportlab.*",
    "pdfplumber.*",
    "pdf2image.*",
    "weasyprint.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --cov=rosetta --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/rosetta"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
