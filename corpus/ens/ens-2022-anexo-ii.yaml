    - ref_id: "mp.if.7"
      name: "Registro de entrada y salida de equipamiento"
      family: "Protección de las instalaciones e infraestructuras"
      annotation: "nivel_exigido=ALTO|dimensiones=Categoría|iso27001_2022=7.2 Controles físicos de entrada; 7.9 Seguridad de activos fuera de las instalaciones; 7.10 Soportes de almacenamiento"
      description: |
