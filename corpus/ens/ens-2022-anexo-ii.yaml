    - ref_id: "mp.if.1"
      name: "Áreas separadas y con control de acceso"
      family: "Protección de las instalaciones e infraestructuras"
      annotation: "nivel_exigido=ALTO|dimensiones=Categoría|iso27001_2022=7.1 Perímetros de seguridad física; 7.2 Entradas físicas; 7.3 Oficinas, salas e instalaciones; 7.4 Vigilancia física; 7.6 Trabajo en áreas seguras"
      description: |
        – [mp.if.1.1] El equipamiento del Centro de Proceso de Datos (CPD) se instalará, en la medida de lo posible, en áreas separadas, específicas para su función.
