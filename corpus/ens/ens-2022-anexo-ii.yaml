    - ref_id: "mp.if.3"
      name: "Acondicionamiento de los locales"
      family: "Protección de las instalaciones e infraestructuras"
      annotation: "nivel_exigido=ALTO|dimensiones=Categoría|iso27001_2022=7.5 Protección contra amenazas físicas y ambientales; 7.8 Ubicación y protección de equipos; 7.12 Seguridad del cableado"
      description: |
        Los locales donde se ubiquen los sistemas de información y sus componentes esenciales dispondrán de elementos adecuados para el eficaz funcionamiento del equipamiento allí instalado, y, en especial, para asegurar:
        – [mp.if.3.1] Las condiciones de temperatura y humedad.
        – [mp.if.3.2] La protección frente a las amenazas identificadas en el análisis de riesgos.
        – [mp.if.3.3] La protección del cableado frente a incidentes fortuitos o deliberados.
      translations:
        es:
          name: "Acondicionamiento de los locales"
          description: |
            Los locales donde se ubiquen los sistemas de información y sus componentes esenciales dispondrán de elementos adecuados para el eficaz funcionamiento del equipamiento allí instalado, y, en especial, para asegurar:
            – [mp.if.3.1] Las condiciones de temperatura y humedad.
            – [mp.if.3.2] La protección frente a las amenazas identificadas en el análisis de riesgos.
            – [mp.if.3.3] La protección del cableado frente a incidentes fortuitos o deliberados.
    - ref_id: "mp.if.5"
      name: "Protección frente a incendios"
      family: "Protección de las instalaciones e infraestructuras"
      annotation: "nivel_exigido=ALTO|dimensiones=D|iso27001_2022=7.5 Protección contra amenazas físicas y ambientales"
